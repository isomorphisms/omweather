name: Android build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Record toolchain
        run: ./gradlew --version

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk"
          zipinfo -1 "$apk" | grep -qx 'AndroidManifest.xml'
          zipinfo -1 "$apk" | grep -qx 'resources.arsc'
          zipinfo -1 "$apk" | grep -q '^classes.*\.dex$'
          sha256sum "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omweather-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
