name: Android build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    env:
      OMWEATHER_TEST_KEYSTORE: ${{ github.workspace }}/ci/omweather-ci-debug.keystore

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Install persistent test signing identity
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/omweather-ci-debug.keystore.b64 > "$OMWEATHER_TEST_KEYSTORE"
          chmod 600 "$OMWEATHER_TEST_KEYSTORE"
          keytool -list -v \
            -keystore "$OMWEATHER_TEST_KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | grep -F 'SHA256: D9:7B:EA:5A:D8:A6:03:94:B8:4D:3B:24:56:16:EB:69:4A:F6:70:A4:3C:1E:52:7F:8F:0D:3C:AA:A5:1C:AF:2A'

      - name: Record toolchain
        run: ./gradlew --version

      - name: Verify Gradle signing configuration
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:signingReport | tee /tmp/omweather-signing-report.txt
          grep -Fq \
            'D9:7B:EA:5A:D8:A6:03:94:B8:4D:3B:24:56:16:EB:69:4A:F6:70:A4:3C:1E:52:7F:8F:0D:3C:AA:A5:1C:AF:2A' \
            /tmp/omweather-signing-report.txt

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package and signer
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk"
          zipinfo -1 "$apk" | grep -qx 'AndroidManifest.xml'
          zipinfo -1 "$apk" | grep -qx 'resources.arsc'
          zipinfo -1 "$apk" | grep -q '^classes.*\.dex$'
          keytool -printcert -jarfile "$apk" \
            | tee /tmp/omweather-apk-certificate.txt
          grep -Fq \
            'SHA256: D9:7B:EA:5A:D8:A6:03:94:B8:4D:3B:24:56:16:EB:69:4A:F6:70:A4:3C:1E:52:7F:8F:0D:3C:AA:A5:1C:AF:2A' \
            /tmp/omweather-apk-certificate.txt
          sha256sum "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omweather-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  replacement-install:
    needs: assemble-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: omweather-debug-apk
          path: downloaded-apk

      - name: Install and replace twice without uninstall
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb install -r downloaded-apk/app-debug.apk
            adb install -r downloaded-apk/app-debug.apk
            adb install -r downloaded-apk/app-debug.apk
            adb shell pm path org.woheller69.omweather | grep -Fq 'package:'
